name: Pipeline CI - Logistica Andina

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias (Build)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Automatizadas (Test)
      run: |
        pytest test_app.py

    - name: Construir Imagen Docker (Containerization)
      run: |
        docker build -t inventario-andina:latest .
